
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Difference Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1, p {
            text-align: center;
        }

        .text-boxes {
            display: flex;
            gap: 20px;
        }

        .text-box {
            flex: 1;
            min-width: 0;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: monospace;
        }

        .added {
            background: #dcfce7;
            color: #166534;
        }

        .removed {
            background: #fee2e2;
            color: #991b1b;
        }

        .unchanged {
            background: #f1f5f9;
        }

        .diff-line {
            padding: 5px;
        }

        @media (max-width: 600px) {
            .text-boxes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Text Difference Checker</h1>
        <p>Compare two versions of text and identify changes.</p>

        <div class="text-boxes">
            <div class="text-box">
                <h3>Original Text</h3>
                <textarea id="original"
                    placeholder="Enter original text"></textarea>
            </div>

            <div class="text-box">
                <h3>Modified Text</h3>
                <textarea id="modified"
                    placeholder="Enter modified text"></textarea>
            </div>
        </div>

        <button onclick="compareText()">Compare Text</button>

        <h3>Comparison Result</h3>
        <div id="result" aria-live="polite"></div>
    </div>

    <script>
        async function compareText() {
            const original = document.getElementById("original").value;
            const modified = document.getElementById("modified").value;
            const result = document.getElementById("result");

            result.textContent = "Comparing...";

            try {
                const response = await fetch("/compare", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ original, modified })
                });

                const data = await response.json();

                if (!response.ok) {
                    result.textContent = data.error || "Comparison failed.";
                    return;
                }

                result.textContent = "";

                data.differences.forEach(line => {
                    if (line.startsWith("? ")) {
                        return;
                    }

                    const div = document.createElement("div");
                    div.className = "diff-line";

                    if (line.startsWith("+ ")) {
                        div.classList.add("added");
                    } else if (line.startsWith("- ")) {
                        div.classList.add("removed");
                    } else {
                        div.classList.add("unchanged");
                    }

                    div.textContent = line;
                    result.appendChild(div);
                });
            } catch (error) {
                result.textContent = "Unable to connect to the server.";
            }
        }
    </script>
</body>
</html>
